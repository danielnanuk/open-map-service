services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: places
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-places}
      POSTGRES_DB: places
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U places -d places"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  opensearch:
    build: deploy/opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  nominatim:
    image: mediagis/nominatim:5.1
    environment:
      PBF_PATH: /pbf/cambodia-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim_places}
      THREADS: "4"
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./data/cambodia-latest.osm.pbf:/pbf/cambodia-latest.osm.pbf:ro
      - nominatim-data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 120
      start_period: 300s

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    ports: ["127.0.0.1:8002:8002"]
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 120s

  gateway:
    build: gateway
    environment:
      DATABASE_URL: postgresql://places:${POSTGRES_PASSWORD:-places}@postgis:5432/places
      OPENSEARCH_URL: http://opensearch:9200
      NOMINATIM_URL: http://nominatim:8080
      VALHALLA_URL: http://valhalla:8002
      OSRM_CAR_URL: http://osrm-car:5000
      OSRM_MOTO_URL: http://osrm-moto:5000
      OSRM_TUKTUK_URL: http://osrm-tuktuk:5000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
    ports: ["8080:8080"]
    depends_on:
      # nominatim/osrm-* 故意不在列:geocode 可回退 OpenSearch、matrix 可降级 Valhalla;valhalla 无回退,需 healthy
      postgis: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      valhalla: {condition: service_healthy}

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/cambodia-latest.osrm
    volumes: ["./data/osrm/car:/data"]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  osrm-moto:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/cambodia-latest.osrm
    volumes: ["./data/osrm/moto:/data"]
    ports: ["127.0.0.1:5001:5000"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  osrm-tuktuk:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/cambodia-latest.osrm
    volumes: ["./data/osrm/tuktuk:/data"]
    ports: ["127.0.0.1:5002:5000"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  osdata:
  nominatim-data:
