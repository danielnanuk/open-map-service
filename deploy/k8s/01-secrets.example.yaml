apiVersion: v1
kind: Secret
metadata: {name: places-secrets, namespace: places}
stringData:
  POSTGRES_PASSWORD: "CHANGE-ME"
---
apiVersion: v1
kind: Secret
metadata: {name: s3-cred, namespace: places}
stringData:
  AWS_ACCESS_KEY_ID: "placesminio"          # EDIT-ME: 真集群换已有 S3 凭据
  AWS_SECRET_ACCESS_KEY: "placesminio123"
  S3_ENDPOINT: "http://minio.places.svc:9000"  # EDIT-ME
  S3_BUCKET: "places-artifacts"
---
