- name: angkor_wat_khmer
  endpoint: searchText
  body: {textQuery: "អង្គរវត្ត"}
  expect_any: ["Angkor", "អង្គរ"]
- name: angkor_wat_english
  endpoint: searchText
  body: {textQuery: "Angkor Wat"}
  expect_any: ["Angkor", "អង្គរ"]
- name: angkor_wat_latin_fuzzy
  endpoint: searchText
  body: {textQuery: "angkor vat"}
  expect_any: ["Angkor", "អង្គរ"]
- name: royal_palace_en
  endpoint: searchText
  body: {textQuery: "Royal Palace Phnom Penh"}
  expect_any: ["Royal Palace", "ព្រះបរមរាជវាំង"]
- name: central_market_khmer
  endpoint: searchText
  body: {textQuery: "ផ្សារធំថ្មី"}
  expect_any: ["Central Market", "ផ្សារធំថ្មី", "Phsar Thmei"]
- name: zh_angkor
  endpoint: searchText
  body: {textQuery: "吴哥窟"}
  expect_any: ["Angkor", "吴哥", "អង្គរ"]
  soft: true
- name: autocomplete_prefix_en
  endpoint: autocomplete
  body: {input: "angk"}
  expect_any: ["Angkor", "អង្គរ"]
- name: nearby_restaurants_pp
  endpoint: searchNearby
  body:
    locationRestriction: {circle: {center: {latitude: 11.5621, longitude: 104.9160}, radius: 2000}}
    includedTypes: ["restaurant"]
  expect_min_results: 3
- name: geocode_street_en
  endpoint: geocode
  params: {address: "Street 271, Phnom Penh"}
  expect_status: OK
  expect_any: ["271", "ផ្លូវ"]
- name: geocode_admin_khmer
  endpoint: geocode
  params: {address: "ខេត្តសៀមរាប"}
  expect_status: OK
  expect_any: ["Siem Reap", "សៀមរាប"]
- name: geocode_poi_routes_to_search
  endpoint: geocode
  params: {address: "Angkor Wat"}
  expect_status: OK
  expect_any: ["Angkor", "អង្គរ"]
- name: reverse_pp_riverside
  endpoint: geocode
  params: {latlng: "11.5621,104.9160"}
  expect_status: OK
  expect_any: ["Phnom Penh", "ភ្នំពេញ", "ផ្សារ"]
- name: routes_pp_to_siemreap_drive
  endpoint: routes
  body:
    origin: {location: {latLng: {latitude: 11.5564, longitude: 104.9282}}}
    destination: {location: {latLng: {latitude: 13.3633, longitude: 103.8564}}}
    travelMode: DRIVE
  expect_distance_km: [280, 400]
- name: routes_pp_moto_crosstown
  endpoint: routes
  body:
    origin: {location: {latLng: {latitude: 11.5564, longitude: 104.9282}}}
    destination: {location: {latLng: {latitude: 11.5984, longitude: 104.9192}}}
    travelMode: TWO_WHEELER
  expect_distance_km: [4, 12]
- name: routes_tuktuk_extension
  endpoint: routes
  body:
    origin: {location: {latLng: {latitude: 11.5564, longitude: 104.9282}}}
    destination: {location: {latLng: {latitude: 11.5696, longitude: 104.9210}}}
    travelMode: TWO_WHEELER
    vehicleProfile: tuktuk
  expect_distance_km: [1, 6]
- name: routes_walk_short
  endpoint: routes
  body:
    origin: {location: {latLng: {latitude: 11.5564, longitude: 104.9282}}}
    destination: {location: {latLng: {latitude: 11.5625, longitude: 104.9311}}}
    travelMode: WALK
  expect_distance_km: [0.3, 3]
